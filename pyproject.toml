[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-labs"
version = "0.2.0"
description = "Timer Pomodoro kecil yang melayang di atas jendela lain (Linux, macOS, Windows)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pomodoro-labs = "pomodoro_labs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
